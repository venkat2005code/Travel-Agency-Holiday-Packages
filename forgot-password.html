<!DOCTYPE html>

<html class="light" dir="ltr" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password | Trek Tailwind</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f8fafc', 900: '#0f172a' },
                        accent: '#fbbf24',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>

<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans antialiased overflow-x-hidden min-h-screen">
<div class="fixed top-6 right-6 z-50 flex gap-3 items-center bg-white/70 dark:bg-gray-800/70 backdrop-blur-md px-3 py-2 rounded-full border border-gray-200 dark:border-gray-700 shadow-sm">
<button id="theme-toggle" class="w-10 h-10 flex items-center justify-center rounded-xl border border-gray-200 dark:border-gray-700 text-gray-500 dark:text-gray-400 hover:text-brand-900 hover:border-brand-900 dark:hover:text-white dark:hover:border-white hover:bg-gray-50 dark:hover:bg-gray-800 transition-all flex-shrink-0">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</button>
<button id="dir-toggle" class="w-10 h-10 flex items-center justify-center rounded-xl border border-gray-200 dark:border-gray-700 text-gray-500 dark:text-gray-400 text-xs font-bold uppercase hover:text-brand-900 hover:border-brand-900 dark:hover:text-white dark:hover:border-white hover:bg-gray-50 dark:hover:bg-gray-800 transition-all flex-shrink-0">LTR</button>
</div>
<div class="h-screen w-full relative overflow-hidden bg-brand-900 flex items-center justify-center">
<div class="absolute top-0 left-0 w-3/5 h-full bg-blue-600 [clip-path:polygon(0_0,100%_0,70%_100%,0%_100%)] z-0"></div>
<div class="relative z-10 w-full max-w-md bg-white dark:bg-gray-800 p-12 rounded-3xl shadow-2xl mx-4 flex flex-col items-center">
<!-- Brand Logo -->
<a class="mb-10 text-3xl font-serif font-bold text-brand-900 dark:text-white tracking-wider flex justify-center w-full hover:opacity-80 transition-opacity cursor-pointer" href="index.html">
<span class="flex items-center gap-2">
<svg class="w-8 h-8 text-accent shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
<span>Trek<span class="text-accent">.</span></span>
</span>
</a>
<h2 class="text-3xl font-serif font-bold mb-4 text-center w-full">Reset Password</h2>
<p class="text-gray-500 dark:text-gray-400 mb-8 text-center w-full">Enter your email address and we'll send you a link to reset your password.</p>
<form class="space-y-6 text-left w-full">
<div class="w-full">
<label class="block text-sm font-bold mb-2">Email Address</label>
<input class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-transparent outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20" type="email"/>
</div>
<button class="w-full py-4 bg-accent text-brand-900 font-bold rounded-xl hover:bg-yellow-500 transition-colors shadow-lg" type="submit">Send Reset Link</button>
</form>
<div class="mt-8 text-center w-full">
<a class="text-gray-500 font-bold hover:text-brand-900 dark:hover:text-white transition-colors" href="login.html">← Back to Login</a>
</div>
</div>
</div>

    <script src="js/main.js"></script>
</body>
</html>
