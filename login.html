<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans antialiased overflow-x-hidden min-h-screen">

</button>

<div class="flex h-screen w-full">

<!-- Brand Logo -->
<a class="mb-10 text-3xl font-serif font-medium text-brand-900 dark:text-white tracking-wider flex justify-center w-full hover:opacity-80 transition-opacity cursor-pointer" href="index.html">
<span class="flex items-center gap-2">
<img src="images/logo.png" alt="Trek Logo" class="w-8 h-8 object-contain shrink-0">
<span>Trek<span class="text-accent">.</span></span>
</span>
</a>
<h2 class="text-4xl font-serif font-medium mb-2 text-brand-900 dark:text-white text-center w-full">Welcome Back</h2>
<p class="text-gray-500 dark:text-gray-400 mb-8 text-center w-full">Please enter your details to sign in.</p>
<form class="space-y-4 w-full">
<div class="w-full">
<label class="block text-sm font-medium mb-2 text-left">Email Address</label>
<input class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-transparent outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20" placeholder="you@example.com" type="email"/>
</div>
<div class="w-full">
<label class="block text-sm font-medium mb-2 text-left">Password</label>
<input class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-transparent outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20" placeholder="••••••••" type="password"/>
</div>
<div class="flex justify-between items-center text-sm w-full">
<label class="flex items-center gap-2 cursor-pointer">
<input class="rounded text-blue-600" type="checkbox"/> Remember me
                    </label>
<a class="text-blue-600 font-medium hover:underline" href="forgot-password.html">Forgot password?</a>
</div>
<button class="w-full py-4 bg-brand-900 text-white font-medium rounded-xl hover:bg-blue-600 transition-colors mt-4" type="submit">Sign In</button>
</form>
<!-- Social Logins -->
<div class="mt-8 w-full">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-gray-200 dark:border-gray-700"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-white dark:bg-gray-800 text-gray-500">Or continue with</span>
</div>
</div>
<div class="mt-6 grid grid-cols-2 gap-4">
<button class="w-full flex items-center justify-center px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl shadow-sm bg-white dark:bg-gray-700 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600 transition-colors">
<svg class="h-5 w-5 mr-2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                        Google
                    </button>
<button class="w-full flex items-center justify-center px-4 py-3 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-[#1877F2] hover:bg-[#166FE5] transition-colors">
<svg class="h-5 w-5 mr-2" fill="currentColor" viewbox="0 0 24 24">
<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>

                        Facebook
                    </button>
</div>
</div>
<p class="text-center mt-8 text-gray-500 w-full">Don't have an account? <a class="text-blue-600 font-medium hover:underline" href="register.html">Sign up</a></p>
</div>
</div>
<!-- Image Side -->
<div class="hidden md:block w-1/2 relative bg-[url('assets/16e9d2b4-ef02-4d81-94d1-94deed6353c6.jpeg')] bg-cover bg-center">
